        <!-- Subtle Top Accent Glow -->
        <path d="M 24 0 L 398 0" stroke="#00D9F5" stroke-width="2" opacity="0.8" />

        <!-- Icon Container -->
        <g transform="translate(32, 28)">
          
        <circle cx="20" cy="20" r="16" fill="#00D9F514" stroke="#00D9F5" stroke-width="1.5" />
        <circle cx="20" cy="20" r="4" fill="#00D9F5" />
        <line x1="20" y1="8" x2="20" y2="13" stroke="#00D9F5" stroke-width="1.5" stroke-linecap="round" />
        <line x1="20" y1="27" x2="20" y2="32" stroke="#00D9F5" stroke-width="1.5" stroke-linecap="round" />
        <line x1="8" y1="20" x2="13" y2="20" stroke="#00D9F5" stroke-width="1.5" stroke-linecap="round" />
        <line x1="27" y1="20" x2="32" y2="20" stroke="#00D9F5" stroke-width="1.5" stroke-linecap="round" />
      
        </g>

        <!-- Card Title -->
        <text x="32" y="96" class="card-title">
          AI &amp; Machine Learning
        </text>

        <!-- Concise Description (2 Clean Lines) -->
        <g transform="translate(32, 128)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif" font-size="16.5" fill="#A1B2CE">
            Architecting autonomous agent workflows,
          </text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif" font-size="16.5" fill="#A1B2CE">
            neural pipelines, and low-latency inference.
          </text>
        </g>
      </g>
    
  
      <g transform="translate(514, 188)">
        <!-- Card Container Surface -->
        <rect x="0" y="0" width="422" height="200" rx="20" fill="#0C1426" stroke="#1C2C4E" stroke-width="1.2" />

        <!-- Subtle Top Accent Glow -->
        <path d="M 24 0 L 398 0" stroke="#287CFF" stroke-width="2" opacity="0.8" />

        <!-- Icon Container -->
        <g transform="translate(32, 28)">
          
        <rect x="6" y="8" width="28" height="20" rx="4" fill="#287CFF14" stroke="#287CFF" stroke-width="1.5" />
        <line x1="6" y1="15" x2="34" y2="15" stroke="#287CFF" stroke-width="1.2" />
        <line x1="16" y1="32" x2="24" y2="32" stroke="#287CFF" stroke-width="1.5" stroke-linecap="round" />
        <line x1="20" y1="28" x2="20" y2="32" stroke="#287CFF" stroke-width="1.5" />
      
        </g>

        <!-- Card Title -->
        <text x="32" y="96" class="card-title">
          Full-Stack Development
        </text>

        <!-- Concise Description (2 Clean Lines) -->
        <g transform="translate(32, 128)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif" font-size="16.5" fill="#A1B2CE">
            Constructing responsive, type-safe web platforms
          </text>
          <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif" font-size="16.5" fill="#A1B2CE">
            with modern reactive architectures.
          </text>
        </g>
      </g>
    
  
      <g transform="translate(64, 412)">
        <!-- Card Container Surface -->
        <rect x="0" y="0" width="422" height="200" rx="20" fill="#0C1426" stroke="#1C2C4E" stroke-width="1.2" />

        <!-- Subtle Top Accent Glow -->
        <path d="M 24 0 L 398 0" stroke="#9566FF" stroke-width="2" opacity="0.8" />

        <!-- Icon Container -->
        <g transform="translate(32, 28)">
          
        <rect x="6" y="6" width="28" height="11" rx="3" fill="#9566FF14" stroke="#9566FF" stroke-width="1.5" />
        <rect x="6" y="21" width="28" height="11" rx="3" fill="#9566FF14" stroke="#9566FF" stroke-width="1.5" />
        <circle cx="12" cy="11.5" r="2" fill="#9566FF" />
